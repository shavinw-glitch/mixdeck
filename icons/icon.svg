<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mixdeck</title>
  <desc id="desc">Coral liquid-glass tile with white sound-wave bars and an orbit ring</desc>
  <defs>
    <linearGradient id="bg" x1=".08" y1="0" x2=".94" y2="1">
      <stop stop-color="#ff9b8b"/>
      <stop offset=".45" stop-color="#f36b62"/>
      <stop offset="1" stop-color="#d94a41"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="warm" cx=".5" cy=".42" r=".65">
      <stop stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rc"><rect width="512" height="512" rx="118"/></clipPath>
  </defs>

  <!-- liquid-glass tile -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#warm)" clip-path="url(#rc)"/>
  <rect y="14" width="512" height="236" fill="url(#gloss)" clip-path="url(#rc)"/>
  <rect width="512" height="512" rx="118" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="6" clip-path="url(#rc)"/>
  <rect y="496" width="512" height="40" fill="#7c2a24" fill-opacity=".16" clip-path="url(#rc)"/>

  <!-- faint orbit ring (the old satellite, quiet and fast) -->
  <circle cx="256" cy="300" r="206" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="8"/>
  <circle cx="256" cy="300" r="206" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="18"/>
  <circle cx="411" cy="193" r="13" fill="#ffffff" fill-opacity=".95"/>

  <!-- sound-wave bars -->
  <g fill="#ffffff">
    <rect x="153" y="302" width="30" height="74" rx="15"/>
    <rect x="197" y="264" width="30" height="112" rx="15"/>
    <rect x="241" y="226" width="30" height="150" rx="15"/>
    <rect x="285" y="264" width="30" height="112" rx="15"/>
    <rect x="329" y="302" width="30" height="74" rx="15"/>
  </g>
</svg>
