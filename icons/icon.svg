<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Wavefy">
  <defs>
    <!-- Light, airy tile. A squircle: the curve starts well inside the edge. -->
    <linearGradient id="tile" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#fff8fa"/>
      <stop offset="1" stop-color="#ffe1ea"/>
    </linearGradient>
    <!-- The ribbon: luminous reds, no mud. Deep enough to read on white. -->
    <linearGradient id="wave" x1="0.05" y1="0.05" x2="0.95" y2="0.95">
      <stop offset="0" stop-color="#ff5f77"/>
      <stop offset="0.38" stop-color="#ee1230"/>
      <stop offset="0.72" stop-color="#ff3d58"/>
      <stop offset="1" stop-color="#ff9aad"/>
    </linearGradient>
    <linearGradient id="waveBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd3dd"/>
      <stop offset="1" stop-color="#ffa9bb"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.05" r="0.92">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft rose lift so the ribbon floats off the tile. -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#ff2a3c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="140" fill="url(#tile)"/>
  <rect width="512" height="512" rx="140" fill="url(#sheen)"/>
  <rect x="1" y="1" width="510" height="510" rx="139" fill="none" stroke="#ffd7e0" stroke-width="2"/>

  <!-- Three crests. The strand crosses back over itself at each turn, which is
       what makes it read as a wave rather than a zig-zag. -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="84">
    <path d="M112 256C144 80 176 80 208 256C240 432 272 432 304 256C336 80 368 80 400 256"
          stroke="url(#waveBack)"/>
    <path d="M208 256C240 432 272 432 304 256C336 80 368 80 400 256"
          stroke="url(#wave)"/>
    <path d="M112 256C144 80 176 80 208 256" stroke="#ff6a80" opacity="0.42"/>
  </g>
</svg>
