<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- dark, slightly warm tile like the reference -->
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2b2b2f"/>
      <stop offset="1" stop-color="#131315"/>
    </linearGradient>
    <!-- the ribbon: bright crimson through to a deep red -->
    <linearGradient id="ribbon" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff2640"/>
      <stop offset="0.5" stop-color="#ee1027"/>
      <stop offset="1" stop-color="#b90c1e"/>
    </linearGradient>
    <!-- glow so the mark sits off the tile instead of looking pasted on -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>

  <!-- One continuous ribbon: up / down / up = the "W". A dimmer strand sits
       underneath so the crossings read as the wave passing behind itself,
       the way the reference image does it. -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="60">
    <!-- back strand: the whole wave, muted -->
    <path d="M76 300C106 150 166 150 196 300c30 150 90 150 120 0 30-150 90-150 120 0"
          stroke="#7d0d1a" opacity="0.9"/>
    <!-- front strand: the trough and the right hump, full crimson -->
    <path d="M196 300c30 150 90 150 120 0 30-150 90-150 120 0" stroke="url(#ribbon)"/>
    <!-- the left hump again, slightly translucent, so it overlaps the trough -->
    <path d="M76 300C106 150 166 150 196 300" stroke="#e5112a" opacity="0.6"/>
  </g>
</svg>
