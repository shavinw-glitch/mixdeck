<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Wavefy">
  <defs>
    <!-- Light tile, a squircle: the curve starts well inside the edge. -->
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fbfafc"/>
      <stop offset="0.55" stop-color="#efedf3"/>
      <stop offset="1" stop-color="#dedbe7"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.04" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- The mark's ink: deep purple through magenta to blue, as in the reference. -->
    <linearGradient id="ink" x1="0.2" y1="0.15" x2="0.8" y2="1">
      <stop offset="0" stop-color="#241436"/>
      <stop offset="0.28" stop-color="#4a2472"/>
      <stop offset="0.52" stop-color="#8f2fa0"/>
      <stop offset="0.72" stop-color="#d0388c"/>
      <stop offset="0.88" stop-color="#4f52c9"/>
      <stop offset="1" stop-color="#2a1c4e"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#2a1a4a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="140" fill="url(#tile)"/>
  <rect width="512" height="512" rx="140" fill="url(#sheen)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="138.5" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>

  <!-- The mark: a head in profile with its quaver cut clean out of it. This
       outline is traced from the reference artwork; index.html carries the same
       geometry as #i-logo, in a 32-unit box. -->
  <g filter="url(#lift)" transform="scale(16)">
    <path fill="url(#ink)" d="M14.62 3.62L16.5 3.62L19 4.38L20 5L20.62 5.88L20.75 5.62L21 6.5L20.62 7.12L22.25 8.12L23.12 9.12L24.5 11.5L24.25 12.75L24.62 13L25.25 12.62L24.5 13.38L27.25 15.25L27.25 15.75L26.5 16.88L27 18L26.12 18.88L26.88 19L27.25 19.38L26.75 20.12L27.12 21L27.12 22L25.88 22.88L22.5 23.25L21.88 24.12L21.5 26L19.75 29.25L17.12 29.88L14.38 29.88L10.12 28.75L11.38 26.5L11 26.38L11.25 25.88L10.88 25.75L10.5 26.12L9.12 25.88L7.88 24.38L7.75 24.62L7.75 23.75L7.12 23.25L6.75 23.38L6.88 23L6.25 22.25L6.12 21.38L5.75 21.38L5.88 20.75L5.12 19.5L4.75 19.5L4.88 18.88L3.88 18.25L3.12 17.12L3.25 15.38L3 15L3.25 14.88L3.12 14.38L3.62 14.25L3.25 12.75L4.12 11.38L4.75 11.25L5.75 10.25L5.75 9.88L6.75 9.5L6.62 8.38L7 7.88L7.62 7.75L10 11.25L11.38 13.88L11.88 15.5L11.88 16.62L12.5 18L13.88 19.25L15 19.62L16.88 19.5L18.38 18.62L19.5 16.75L19.62 15.5L19.12 13.88L17.62 12.38L16.38 12L14.75 11L13.25 9.5L10.5 5.75L10.88 5L11.12 5.12L11.25 4.75L11.5 4.88L12.62 4L14.62 3.75Z"/>
