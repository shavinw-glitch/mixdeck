<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mixdeck</title>
  <desc id="desc">Coral sound waves on a soft light gradient with a faint orbit ring</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffaf7"/>
      <stop offset="1" stop-color="#f6ebe4"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff8d82"/>
      <stop offset="1" stop-color="#e2544a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="272" r="176" fill="#f36b62" fill-opacity=".055"/>

  <!-- faint orbit ring — a quiet nod to the original satellite mark -->
  <ellipse cx="256" cy="272" rx="180" ry="62" transform="rotate(-10 256 272)" fill="none" stroke="#f36b62" stroke-opacity=".16" stroke-width="9"/>
  <circle cx="412" cy="218" r="10" fill="#f36b62" fill-opacity=".55"/>

  <!-- sound wave bars, Spotify-style but in Mixdeck coral -->
  <rect x="158" y="236" width="28" height="72" rx="14" fill="url(#wave)"/>
  <rect x="200" y="218" width="28" height="108" rx="14" fill="url(#wave)"/>
  <rect x="242" y="204" width="28" height="136" rx="14" fill="url(#wave)"/>
  <rect x="284" y="218" width="28" height="108" rx="14" fill="url(#wave)"/>
  <rect x="326" y="236" width="28" height="72" rx="14" fill="url(#wave)"/>
</svg>