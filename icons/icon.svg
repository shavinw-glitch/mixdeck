<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ec8ff"/>
      <stop offset="0.5" stop-color="#7b8cff"/>
      <stop offset="1" stop-color="#b06bff"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150610"/>
      <stop offset="1" stop-color="#070205"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <circle cx="256" cy="250" r="170" fill="#6a5bff" opacity="0.14"/>

  <!-- light version of the Wavefy wave mark -->
  <g filter="url(#soft)">
    <path d="M96 268c26-108 52-108 78 0s52 108 78 0 52-108 78 0 52 108 78 0"
          fill="none" stroke="url(#waveGrad)" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
    <path d="M104 262c25-104 50-104 75 0s50 104 75 0 50-104 75 0 50 104 75 0"
          fill="none" stroke="url(#waveGrad)" stroke-width="22"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sparkle: the "light" accent -->
  <circle cx="392" cy="146" r="13" fill="#c8b4ff"/>
  <circle cx="428" cy="182" r="7" fill="#9fd8ff"/>
</svg>
