<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Wavefy">
  <defs>
    <!-- Light tile, a squircle: the curve starts well inside the edge. -->
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fbfafc"/>
      <stop offset="0.55" stop-color="#efedf3"/>
      <stop offset="1" stop-color="#dedbe7"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.04" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- The mark's ink. userSpaceOnUse so the sweep runs across all four bars
         instead of restarting inside each one. -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="24" y1="32" x2="488" y2="480">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="0.15" stop-color="#ff1493"/>
      <stop offset="0.3" stop-color="#c2185b"/>
      <stop offset="0.45" stop-color="#9b59b6"/>
      <stop offset="0.6" stop-color="#7c3aed"/>
      <stop offset="0.75" stop-color="#4f46e5"/>
      <stop offset="0.88" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#2a1a4a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="140" fill="url(#tile)"/>
  <rect width="512" height="512" rx="140" fill="url(#sheen)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="138.5" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>

  <!-- The mark: four bars, the same geometry index.html carries as #i-logo —
       32 units scaled by 16, sharing a baseline at y = 27 (432 here). -->
  <g fill="url(#ink)" transform="scale(16)">
    <rect x="3.9"  y="11" width="4.4" height="16" rx="2.2"/>
    <rect x="10.5" y="5"  width="4.4" height="22" rx="2.2"/>
    <rect x="17.1" y="15" width="4.4" height="12" rx="2.2"/>
    <rect x="23.7" y="8"  width="4.4" height="19" rx="2.2"/>
  </g>
</svg>
