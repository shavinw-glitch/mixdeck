<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Watercolor wash: the painting's five colors bleeding like wet paint -->
    <radialGradient id="wcPink" cx="0.22" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#fbb7c7"/>
      <stop offset="0.55" stop-color="#f29db4"/>
      <stop offset="1" stop-color="#f29db4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wcPeach" cx="0.85" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#fce6d3"/>
      <stop offset="0.6" stop-color="#fad3b8"/>
      <stop offset="1" stop-color="#fad3b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wcSky" cx="0.2" cy="0.88" r="0.75">
      <stop offset="0" stop-color="#c0e9ed"/>
      <stop offset="0.6" stop-color="#a5dde6"/>
      <stop offset="1" stop-color="#a5dde6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wcMint" cx="0.88" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#cdeddd"/>
      <stop offset="0.6" stop-color="#a9dfc2"/>
      <stop offset="1" stop-color="#a9dfc2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="noteGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d66a86"/>
      <stop offset="0.55" stop-color="#e8889f"/>
      <stop offset="1" stop-color="#fbb7c7"/>
    </linearGradient>
    <filter id="softEdge" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Rounded-square watercolor tile -->
  <rect x="8" y="8" width="496" height="496" rx="118" fill="#fdf4ef"/>
  <g filter="url(#softEdge)">
    <rect x="8" y="8" width="496" height="496" rx="118" fill="url(#wcPink)"/>
    <rect x="8" y="8" width="496" height="496" rx="118" fill="url(#wcPeach)"/>
    <rect x="8" y="8" width="496" height="496" rx="118" fill="url(#wcSky)"/>
    <rect x="8" y="8" width="496" height="496" rx="118" fill="url(#wcMint)"/>
  </g>

  <!-- Eighth note, crisp above the wash -->
  <g fill="url(#noteGrad)">
    <path d="M208 358c0 26-24 44-54 44s-52-16-52-40c0-23 22-39 51-39 12 0 23 2 32 7V158l168-42v64l-136 34v144z"/>
    <path d="M353 132l32-8v66l-32 8z" opacity=".92"/>
  </g>
  <ellipse cx="168" cy="366" rx="46" ry="34" fill="url(#noteGrad)"/>
</svg>
